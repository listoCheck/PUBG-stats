# Include in the existing HTTPS server block; also load pubg-screenshot-limit.conf in http context.
    # PUBG app is isolated under /pubg; existing DocumentVault routes remain unchanged.
    location = /pubg { return 308 /pubg/; }
    location = /pubg/api/screenshot/recognize {
        limit_req zone=pubg_screenshot burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 12m;
        proxy_http_version 1.1;
        proxy_set_header X-Forwarded-Prefix /pubg;
        rewrite ^/pubg(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5000;
    }
    location ~ ^/pubg/api/(players|dashboard)$ {
        limit_req zone=pubg_api burst=4 nodelay;
        limit_req_status 429;
        error_page 429 = @pubg_api_limited;
        client_max_body_size 32k;
        proxy_set_header X-Forwarded-Prefix /pubg;
        rewrite ^/pubg(/.*)$ $1 break;
        proxy_pass http://127.0.0.1:5000;
    }
    location @pubg_api_limited {
        default_type application/json;
        return 429 '{"error":"Слишком много запросов. Подождите и попробуйте снова."}';
    }
    location /pubg/ {
        proxy_set_header X-Forwarded-Prefix /pubg;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:5000/;
    }
