server {
    listen 80;
    listen [::]:80;
    server_name 95.174.95.143;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { include /etc/nginx/snippets/pubg-http-mode.conf; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name 95.174.95.143;
    ssl_certificate /etc/nginx/tls/pubg/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/pubg/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE+AESGCM:ECDHE+CHACHA20;
    ssl_session_cache shared:PUBG_TLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    location ~ ^/api/(players|dashboard)$ {
        limit_req zone=pubg_api burst=4 nodelay;
        limit_req_status 429;
        error_page 429 = @pubg_api_rate_limited;
        client_max_body_size 32k;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    location @pubg_api_rate_limited {
        default_type application/json;
        return 429 '{"error":"Слишком много запросов. Подождите и попробуйте снова."}';
    }
    location = /api/screenshot/recognize {
        limit_req zone=pubg_screenshot burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 120s;
    }
}
